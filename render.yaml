# Render Blueprint — locks the deploy shape so nothing has to be guessed.
# Adopt via Render dashboard: New > Blueprint > this repo (service name
# cipher-trhq matches the existing one). Harmless if never adopted.
services:
  - type: web
    name: cipher-trhq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11.9"
