<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher — Private Messaging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Ambient background glows -->
<div class="ambient">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
</div>

<!-- Announcement banner (populated by JS) -->
<div id="announcement-bar" class="announcement-bar hidden"></div>

<!-- ============================================
     AUTH SCREEN
============================================ -->
<div id="auth-screen" class="screen auth-screen">
  <div class="auth-wrap">
    <div class="auth-brand">
      <h1 class="brand-logo">CIPHER</h1>
      <p class="brand-tag">Private messaging. Nothing stays forever.</p>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Sign in</button>
        <button class="tab" data-tab="signup" type="button">Create account</button>
      </div>

      <form id="auth-form" class="auth-form" autocomplete="on">
        <div class="field">
          <label>Username</label>
          <input type="text" id="auth-username" placeholder="your_name" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="field hidden" id="invite-field">
          <label>Invite code <span class="opt">(optional)</span></label>
          <input type="text" id="auth-invite" placeholder="Paste invite code">
        </div>
        <div class="field hidden" id="totp-field">
          <label>2FA code</label>
          <input type="text" id="auth-totp" placeholder="6-digit code from your app" maxlength="6" inputmode="numeric">
        </div>
        <button type="submit" id="auth-submit" class="btn primary lg">Sign in</button>
        <p id="auth-error" class="form-msg"></p>
      </form>

      <div class="auth-footer">
        <button class="link" type="button" onclick="showRecoverModal()">Forgot password?</button>
        <span class="sep">•</span>
        <button class="link" type="button" onclick="showCreditsModal()">About</button>
      </div>
    </div>

      <div class="auth-meta">
      <span>v1.1.0</span>
      <span class="sep">•</span>
      <span>Built by <b>Stepundrik</b></span>
    </div>
  </div>
</div>

<!-- ============================================
     APP SCREEN
============================================ -->
<div id="app-screen" class="screen app-screen hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand-mini">CIPHER</div>
      <button class="ic-btn ghost" id="logout-btn" title="Sign out" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

    <div class="me-card">
      <div class="avatar lg" id="me-avatar">?</div>
      <div class="me-info">
        <div class="me-name" id="my-username">?</div>
        <div class="me-status">
          <span class="dot-online"></span>
          Online
        </div>
      </div>
    </div>

    <button id="new-chat-btn" class="btn primary with-icon" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="tool-row">
      <button id="new-group-btn" class="tool" title="New group" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button id="search-btn" class="tool" title="Search" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button id="invites-btn" class="tool" title="Invites" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </button>
      <button id="settings-btn" class="tool" title="Settings" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="admin-btn" class="tool hidden" title="Admin" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
      </button>
    </div>

    <div class="side-heading">Conversations</div>
    <div id="conv-list" class="conv-list"></div>

    <div class="side-footer">
      <button class="link small" type="button" onclick="showCreditsModal()">About Cipher</button>
      <div class="version">v1.1.0</div>
    </div>
  </aside>

  <main class="main">
    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <div class="empty-logo">CIPHER</div>
      <h2>Welcome, <span id="empty-username">friend</span></h2>
      <p>Select a conversation or start a new one to begin.</p>
      <button class="btn primary" type="button" onclick="document.getElementById('new-chat-btn').click()">Start a new chat</button>
    </div>

    <!-- Chat view -->
    <div id="chat-view" class="chat-view hidden">
      <header class="chat-header">
        <div class="chat-title-wrap">
          <div class="avatar md" id="chat-avatar">?</div>
          <div class="chat-title-block">
            <h3 id="chat-title">Chat</h3>
            <div id="chat-subtitle" class="chat-sub"></div>
          </div>
        </div>
        <div class="chat-actions">
          <button class="ic-btn ghost" id="mute-btn" title="Mute/Unmute" type="button" onclick="toggleMute()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <button class="ic-btn ghost" id="group-info-btn" title="Group members" type="button" onclick="showGroupInfo()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </button>
          <button class="ic-btn ghost" title="Export as .txt" type="button" onclick="exportCurrent()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="ic-btn ghost danger" title="Leave" type="button" onclick="leaveCurrent()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <!-- Expiry warning banner (48h) -->
      <div id="expiry-warning" class="expiry-warning hidden">
        <div class="warn-content">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="expiry-warning-text">Some messages will be deleted soon.</span>
        </div>
        <div class="warn-actions">
          <button class="btn-mini" type="button" onclick="extendAllMessages()">Keep +30 days</button>
          <button class="btn-mini ghost" type="button" onclick="dismissExpiryWarning()">Dismiss</button>
        </div>
      </div>

      <div id="messages" class="messages" tabindex="0"></div>

      <div id="typing-indicator" class="typing-indicator hidden">
        <span class="dots"><span></span><span></span><span></span></span>
        <span id="typing-text"></span>
      </div>

      <div id="image-preview" class="image-preview hidden"></div>

      <form id="msg-form" class="msg-form">
        <button type="button" class="comp-btn" title="Attach image" onclick="document.getElementById('img-input').click()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input type="file" id="img-input" accept="image/*" hidden>
        <input type="text" id="msg-input" class="comp-input" placeholder="Write a message… (Ctrl+V to paste image)" autocomplete="off">
        <button type="submit" class="comp-send" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>

<!-- ============================================
     MODAL SYSTEM
============================================ -->
<div id="modal-bg" class="modal-bg hidden">
  <div id="modal" class="modal">
    <button class="modal-close" onclick="closeModal()" type="button" title="Close">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Image fullscreen viewer -->
<div id="img-viewer" class="img-viewer hidden" onclick="this.classList.add('hidden')">
  <img id="img-viewer-img" src="" alt="">
</div>

<!-- Toast notifications container -->
<div id="toast-container" class="toast-container"></div>

<script src="/static/app.js"></script>

</html>
